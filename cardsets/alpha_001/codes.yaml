cards:
  - number: CC-A001-001
    id: cronling
    name: Cronling
    type: code
    faction: coder
    rarity: common
    out: 2
    stab: 4
    pattern: row
    ascii:
      - " /|__|\\"
      - "(o.  .o)"
      - "< == >"
      - ":;;__;;:"
    text:
      - "If at least one friendly Item is in this row, this Code gets +1 OUT."
      - "On Run, deal 1 damage to the mirrored enemy slot."
    effects:
      - trigger: code_execution
        condition:
          row_has_item: true
        effect:
          type: modify_out
          target: self
          amount: 1
      - trigger: code_execution
        effect:
          type: damage
          target: mirror
          amount: 1
    notes: "Basic reliable Coder. First reference Code."

  - number: CC-A001-002
    id: vibe_bug
    name: Vibe Bug
    type: code
    faction: vibecoder
    rarity: common
    out: 3
    stab: 2
    pattern: diagonal
    ascii:
      - " /|~~|\\"
      - "(x.  .x)"
      - "< ?! >"
      - ":~:    :~: ~>>"
    text:
      - "If an Event is diagonal to this Code, this Code gets +2 OUT."
      - "On Run, if no Event is diagonal to this Code, roll W6. On 1-3, lose 1 STAB after Run."
    effects:
      - trigger: code_execution
        condition:
          diagonal_has_event: true
        effect:
          type: modify_out
          target: self
          amount: 2
      - trigger: end_of_run
        condition:
          diagonal_has_event: false
        roll:
          on: [1, 2, 3]
        effect:
          type: damage
          target: self
          amount: 1
    notes: "High output, unstable. Uses W6, see docs/randomness_v0_1.md."

  - number: CC-A001-003
    id: legacy_brick
    name: Legacy Brick
    type: code
    faction: ki_verweigerer
    rarity: common
    out: 1
    stab: 7
    pattern: adjacent
    ascii:
      - " [____]"
      - "(-.  .-)"
      - "< ## >"
      - ":==:  :==:"
    text:
      - "Ignore the first opposing Event effect that would affect this slot."
      - "If no KI-Noob is adjacent, this Code gets +1 OUT."
    effects:
      - trigger: code_execution
        condition:
          not_adjacent_faction: ki_noob
        effect:
          type: modify_out
          target: self
          amount: 1
    notes: >-
      Tank and anti-chaos baseline. Line 1 (ignore opposing Event) is
      PvP-only and stays text until opposing Events exist (M8).

  - number: CC-A001-004
    id: promptling
    name: Promptling
    type: code
    faction: ki_noob
    rarity: common
    out: 1
    stab: 3
    pattern: adjacent
    ascii:
      - " /|oo|\\"
      - "(^.  .^)"
      - "< ?! >"
      - "::.    .::"
    text:
      - "If an adjacent Item triggers, gain +1 XP at end of Run."
      - "If an Event is in this column, reroll this Code's OUT for this Run, result 1..4."
    notes: >-
      Learner Code. Good for progression tests. Not machine-readable yet:
      XP needs card instances (M7); the 1..4 reroll conflicts with
      randomness_v0_1.md §3 (no custom die faces) and needs a rules
      decision first.

  - number: CC-A001-005
    id: null_imp
    name: Null Imp
    type: code
    faction: vibecoder
    rarity: uncommon
    out: 2
    stab: 3
    pattern: column
    ascii:
      - "  ^"
      - " /|~~|\\"
      - "(x.  .x)"
      - "< !! >"
      - ":~:    :~:"
    text:
      - "On Run, if this column contains exactly one Item, deal +2 damage to mirrored enemy slot."
      - "If this Code disables an enemy Code, gain +1 OUT next Run."
    effects:
      - trigger: code_execution
        condition:
          column_items_exactly: 1
        effect:
          type: damage
          target: mirror
          amount: 2
    notes: >-
      First uncommon Code. Aggro with column planning. Line 2 (on-disable
      bonus) needs enemy Codes and cross-run tracking; stays text until PvP.

  - number: CC-A001-006
    id: patch_goblin
    name: Patch Goblin
    type: code
    faction: coder
    rarity: common
    out: 1
    stab: 5
    pattern: adjacent
    ascii:
      - " /|__|\\"
      - "(^.  .^)"
      - "< ~~ >"
      - ":;;__;;: +++"
    text:
      - "Adjacent friendly Codes get +1 STAB before damage is resolved."
      - "If Docker is in the same row, this Code gets +1 OUT."
    effects:
      - trigger: before_damage
        effect:
          type: modify_stab
          target: friendly_codes_adjacent
          amount: 1
      - trigger: code_execution
        condition:
          row_has_card: docker
        effect:
          type: modify_out
          target: self
          amount: 1
    notes: "Support Code. Stabilizes early grids."
